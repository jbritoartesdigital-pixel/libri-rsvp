name: Libri release preflight (read only)
on:
  push:
    branches:
      - feat/rsvp-import-passkeys-checkin-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test token scope against configured D1 and Worker (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Cloudflare Action secrets missing'; exit 1;
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const raw=fs.readFileSync('wrangler.jsonc','utf8').replace(/\/\/.*$/gm,'');
          const config=JSON.parse(raw);
          const configuredDb=config.d1_databases[0].database_id;
          const root='https://api.cloudflare.com/client/v4';
          async function check(name,path,inspect){
            try{
              const res=await fetch(root+path,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
              const j=await res.json();
              const codes=(j.errors||[]).map(x=>x.code).filter(x=>x!=null).join(',')||'none';
              let extra='';
              if(inspect==='d1-list'&&Array.isArray(j.result)){
                extra=' target_db_visible='+j.result.some(x=>x.uuid===configuredDb)+' target_name_visible='+j.result.some(x=>x.name===config.d1_databases[0].database_name);
              }
              if(inspect==='worker-list'&&Array.isArray(j.result)){
                extra=' target_worker_visible='+j.result.some(x=>x.id===config.name);
              }
              console.log(name+': HTTP '+res.status+' success='+Boolean(j.success)+' error_codes='+codes+extra);
            }catch(err){console.log(name+': network-or-response-error='+err.name);}
          }
          await check('token_verify','/user/tokens/verify');
          await check('configured_account','/accounts/'+encodeURIComponent(account));
          await check('account_D1_list','/accounts/'+encodeURIComponent(account)+'/d1/database','d1-list');
          await check('configured_D1_get','/accounts/'+encodeURIComponent(account)+'/d1/database/'+encodeURIComponent(configuredDb));
          await check('account_Worker_list','/accounts/'+encodeURIComponent(account)+'/workers/scripts','worker-list');
          NODE
          echo 'All Cloudflare checks were read-only. No deployment or remote migration attempted.'
