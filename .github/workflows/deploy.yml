name: Deploy Libri RSVP

# Production publication is manual only. D1 migrations 0005/0006
# were applied separately in the Cloudflare dashboard and verified.
on:
  # Publicar somente por Run workflow ou solicitacao explicita.
  workflow_dispatch:
    inputs:
      migration_0007_confirmed:
        description: 'Confirme que a migração 0007_child_ages.sql já foi aplicada ao D1 libri-rsvp-db'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: libri-rsvp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o commit aprovado
        uses: actions/checkout@v4

      - name: Proteger produção contra falta da migração 0007
        env:
          MIGRATION_CONFIRMED: ${{ inputs.migration_0007_confirmed }}
        run: |
          if [ "$MIGRATION_CONFIRMED" != "true" ]; then
            echo "::error::Não publicar: primeiro aplicar e verificar a migração 0007 no D1 libri-rsvp-db."
            exit 1
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências, validar e testar
        run: |
          npm install --no-audit --no-fund
          npm run vendor:pdf
          npm run check
          npm test

      - name: Conferir pacote Cloudflare sem publicar
        run: npx wrangler deploy --dry-run --outdir /tmp/libri-rsvp-release

      # Trava crítica antes de qualquer publicação: não acessa D1/R2 real.
      - name: Preparar Chrome e Playwright isoladamente
        run: |
          npm install --prefix /tmp/libri-browser-deps --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          ln -s /tmp/libri-browser-deps/node_modules/playwright node_modules/playwright

      - name: Impedir deploy com falha mobile, login ou diagnóstico
        run: node tests/etapa2-browser.mjs

      - name: Guardar diagnóstico da Etapa 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libri-rsvp-etapa2-deploy-${{ github.run_id }}
          path: .artifacts/etapa2-rsvp/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar Worker e arquivos estáticos
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

# IMPORTANT: This workflow never invokes D1 migration commands: the API token
# can deploy Workers but cannot access D1. Migrations must be applied and
# verified in the production D1 Console before this workflow is allowed to run.
